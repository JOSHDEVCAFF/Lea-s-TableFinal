<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Picture Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: 'Alice', serif;
            font-size: 18px;
            background: 
                url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=2073&q=80') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                rgba(0, 25, 50, 0.75) 0%,
                rgba(0, 60, 100, 0.55) 40%,
                rgba(0, 100, 140, 0.45) 70%,
                rgba(0, 140, 170, 0.35) 100%
            );
            z-index: 0;
            pointer-events: none;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 30% 0%, rgba(255, 255, 255, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 0%, rgba(200, 230, 255, 0.08) 0%, transparent 45%),
                linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            background-size: 100% 100%, 100% 100%, 200% 100%;
            animation: lightBeams 8s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes lightBeams {
            0% { background-position: 0 0, 100% 0, 0 0; opacity: 0.6; }
            50% { background-position: 0 0, 100% 0, 100% 0; opacity: 1; }
            100% { background-position: 0 0, 100% 0, 0 0; opacity: 0.6; }
        }
        .gallery-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.94);
            border: 3px solid #0077b6;
            border-radius: 8px;
            box-shadow: 
                0 0 40px rgba(0, 120, 180, 0.4),
                0 0 80px rgba(0, 80, 140, 0.25),
                0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .top-bar {
            background: linear-gradient(90deg, #0077b6, #0096c7, #00b4d8);
            padding: 8px 18px;
            border-bottom: 2px solid #0096c7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            font-family: 'Alice', serif;
            font-size: 17px;
        }
        .window-buttons span {
            margin-left: 8px;
            font-size: 14px;
        }
        .gallery-content {
            padding: 35px 30px;
            text-align: center;
        }
        .gallery-title {
            font-family: 'Alice', serif;
            font-size: 28px;
            color: #0077b6;
            margin: 0 0 25px;
            letter-spacing: 1px;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            justify-items: center;
        }
        .image-grid a {
            border: 3px solid #0077b6;
            border-radius: 4px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .image-grid a:hover {
            transform: scale(1.08);
            box-shadow: 
                0 0 20px rgba(0, 180, 216, 0.6),
                0 0 35px rgba(0, 150, 200, 0.35),
                0 4px 12px rgba(0, 0, 0, 0.15);
        }
        .image-grid img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            display: block;
        }
        @media (max-width: 500px) {
            .image-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <div class="top-bar">
            <span>My Gallery</span>
            <div class="window-buttons">
                <span>□</span>
                <span>×</span>
            </div>
        </div>
        <div class="gallery-content">
            <h2 class="gallery-title">MY PICTURE GALLERY</h2>
            <div class="image-grid">
                <a href="https://www.google.com" target="_blank">
                    <img src="https://picsum.photos/id/1039/200/200" alt="Nature">
                </a>
                <a href="https://www.youtube.com" target="_blank">
                    <img src="https://picsum.photos/id/2/200/200" alt="Keyboard">
                </a>
                <a href="https://www.wikipedia.org" target="_blank">
                    <img src="https://picsum.photos/id/1016/200/200" alt="Landscape">
                </a>
                <a href="https://www.facebook.com" target="_blank">
                    <img src="https://picsum.photos/id/1025/200/200" alt="Stones">
                </a>
            </div>
        </div>
    </div>
</body>
</html>
