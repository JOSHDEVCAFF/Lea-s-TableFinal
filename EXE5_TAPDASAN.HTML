<!DOCTYPE html>
<html>
<head>
    <title>Other Text Formatting Tags</title>
</head>
<body>
    <h2>Sample Output:</h2>

    <p><i>Italic</i></p>
    <p><u>Underline</u></p>

    <!-- Addtional common formating tags -->
    <p><b>Bold</b></p>
    <p><big>Big Text</big></p>
    <p><small>Small Text</small></p>
    <p><strong>Strong Text</strong></p>
    <p><em>Empasized Text</em></p>
    <p><mark>Marked / Highlighted Text</mark></p>
    <p><del>Deleted / Strikethrough Text</del></p>
    <P><ins>Inserted Text</ins></p>
    <p><sub>Subscript</sub> Example: H<sub>2</sub>O</p>
    <p><sup>Superscript</sup> Example: X<sup>2</sup></p>

</body>
</html>
