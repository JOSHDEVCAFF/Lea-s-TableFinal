<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY GALLERY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: url('https://picsum.photos/id/1036/1920/1080') no-repeat center center fixed;
            background-size: cover;
            padding: 50px 25px;
            font-family: 'Segoe UI', Georgia, serif;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(210,230,255,0.55));
            z-index: -1;
        }

        .container {
            max-width: 620px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.94);
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(43, 108, 184, 0.25);
            border: 2px solid rgba(74, 144, 226, 0.3);
            backdrop-filter: blur(8px);
        }

        h1 {
            text-align: center;
            color: #1a5fb4;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 35px;
            padding-bottom: 15px;
            border-bottom: 3px solid #4a90e2;
            text-transform: uppercase;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.12);
            transition: all 0.35s ease;
            border: 3px solid #fff;
        }

        .gallery-item:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 25px rgba(26, 95, 180, 0.25);
            border-color: #4a90e2;
        }

        .gallery-item img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.12);
        }

        @media (max-width: 520px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            h1 {
                font-size: 26px;
            }
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MY GALLERY</h1>
        <div class="gallery">
            <a href="https://www.google.com" target="_blank" class="gallery-item">
                <img src="https://picsum.photos/id/15/300/200" alt="Mountains">
            </a>
            <a href="https://www.yahoo.com" target="_blank" class="gallery-item">
                <img src="https://picsum.photos/id/190/300/200" alt="Sunset">
            </a>
            <a href="https://www.bing.com" target="_blank" class="gallery-item">
                <img src="https://picsum.photos/id/106/300/200" alt="Flowers">
            </a>
            <a href="https://www.youtube.com" target="_blank" class="gallery-item">
                <img src="https://picsum.photos/id/1039/300/200" alt="Waterfall">
            </a>
            <a href="https://www.google.com" target="_blank" class="gallery-item">
                <img src="https://picsum.photos/id/102/300/200" alt="Forest">
            </a>
            <a href="https://www.yahoo.com" target="_blank" class="gallery-item">
                <img src="https://picsum.photos/id/1038/300/200" alt="Beach">
            </a>
            <a href="https://www.bing.com" target="_blank" class="gallery-item">
                <img src="https://picsum.photos/id/104/300/200" alt="Lake">
            </a>
            <a href="https://www.microsoft.com" target="_blank" class="gallery-item">
                <img src="https://picsum.photos/id/1067/300/200" alt="City">
            </a>
        </div>
    </div>
</body>
</html>
